services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: smartparking-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: smartparking-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # INTERNAL = other containers (use host "kafka"); EXTERNAL = host machine (localhost)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Creates the parking-events topic once Kafka is healthy
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: smartparking-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic parking-events --partitions 3 --replication-factor 1 && \
       echo '✅ Topic parking-events ready'"

  cassandra:
    image: cassandra:4.1
    container_name: smartparking-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: SmartParkingCluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 15s
      timeout: 10s
      retries: 12

  # Applies the keyspace + table schema once Cassandra is healthy
  cassandra-init:
    image: cassandra:4.1
    container_name: smartparking-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra_schema.cql:/schema.cql
    command: >
      sh -c "cqlsh cassandra 9042 -f /schema.cql"

  spark:
    image: apache/spark:3.5.6
    container_name: smartparking-spark
    user: root
    depends_on:
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    volumes:
      - ./:/app
    working_dir: /app
    command: tail -f /dev/null
